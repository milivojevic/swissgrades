<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Squares Calculator</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23FF0000'/><rect x='13' y='6' width='6' height='20' fill='white'/><rect x='6' y='13' width='20' height='6' fill='white'/></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .problem-statement {
            background: #ecf0f1;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border-left: 4px solid #3498db;
        }

        .problem-statement h2 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 1.3em;
        }

        .problem-statement p {
            color: #34495e;
            margin-bottom: 10px;
        }

        .input-section {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 600;
        }

        input[type="number"] {
            width: 100%;
            max-width: 300px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1.1em;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1em;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .results {
            margin-top: 30px;
        }

        .results h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .grid-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .grid-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .grid-card:hover {
            transform: scale(1.05);
        }

        .grid-dimensions {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .grid-info {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .no-results {
            background: #fee;
            color: #c33;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            border-left: 4px solid #c33;
        }

        .verification {
            background: #e8f5e9;
            padding: 20px;
            border-radius: 8px;
            margin-top: 30px;
            border-left: 4px solid #4caf50;
        }

        .verification h3 {
            color: #2e7d32;
            margin-bottom: 15px;
        }

        .verification-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            margin: 5px 0;
            background: white;
            border-radius: 4px;
        }

        .breakdown {
            margin-top: 30px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
        }

        .breakdown h3 {
            color: #2c3e50;
            margin-bottom: 15px;
        }

        .breakdown-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }

        .breakdown-table th,
        .breakdown-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ecf0f1;
        }

        .breakdown-table th {
            background: #667eea;
            color: white;
            font-weight: 600;
        }

        .breakdown-table tr:last-child td {
            border-bottom: none;
        }

        .breakdown-table tr:hover {
            background: #f8f9fa;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .grid-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔢 Grid Squares Calculator</h1>
        <p class="subtitle">Find grid dimensions that contain a specific number of squares</p>

        <div class="problem-statement">
            <h2>Problem Statement</h2>
            <p><strong>In a 3×6 grid, there are 32 squares of all sizes in total.</strong></p>
            <p><strong>In a 4×4 grid, there are 30 squares.</strong></p>
            <p><strong>In which grids can we count 1365 squares?</strong></p>
        </div>

        <div class="input-section">
            <label for="target-squares">Enter the target number of squares:</label>
            <input type="number" id="target-squares" value="1365" min="1" step="1">
            <button id="calculate-btn">Calculate Grid Dimensions</button>
        </div>

        <div id="results" class="results hidden">
            <h2>Results</h2>
            <div id="results-content"></div>
        </div>
    </div>

    <script type="module">
        import { countSquares, findGridsWithSquares, getSquareBreakdown } from './squares.js';

        const targetInput = document.getElementById('target-squares');
        const calculateBtn = document.getElementById('calculate-btn');
        const resultsDiv = document.getElementById('results');
        const resultsContent = document.getElementById('results-content');

        function displayResults(targetCount) {
            const solutions = findGridsWithSquares(targetCount);
            
            resultsDiv.classList.remove('hidden');
            
            if (solutions.length === 0) {
                resultsContent.innerHTML = `
                    <div class="no-results">
                        <h3>No solutions found</h3>
                        <p>No grid dimensions up to 100×100 contain exactly ${targetCount} squares.</p>
                        <p>Try a different number or increase the search range.</p>
                    </div>
                `;
                return;
            }

            // Group by unique grids (removing duplicates of m×n and n×m)
            const uniqueGrids = [];
            const seen = new Set();
            for (const grid of solutions) {
                const key = Math.min(grid.width, grid.height) + ',' + Math.max(grid.width, grid.height);
                if (!seen.has(key)) {
                    seen.add(key);
                    uniqueGrids.push(grid);
                }
            }

            let html = `
                <div class="grid-list">
            `;

            for (const grid of uniqueGrids) {
                const breakdown = getSquareBreakdown(grid.height, grid.width);
                const breakdownEntries = Object.entries(breakdown);
                
                html += `
                    <div class="grid-card">
                        <div class="grid-dimensions">${grid.width}×${grid.height}</div>
                        <div class="grid-info">or ${grid.height}×${grid.width}</div>
                    </div>
                `;
            }

            html += `</div>`;

            // Add verification section
            html += `
                <div class="verification">
                    <h3>✓ Verification</h3>
            `;

            for (const grid of uniqueGrids) {
                const count = countSquares(grid.height, grid.width);
                html += `
                    <div class="verification-item">
                        <span><strong>${grid.width}×${grid.height} grid:</strong></span>
                        <span>${count} squares</span>
                    </div>
                `;
            }

            html += `</div>`;

            // Add detailed breakdown for the first solution
            if (uniqueGrids.length > 0) {
                const firstGrid = uniqueGrids[0];
                const breakdown = getSquareBreakdown(firstGrid.height, firstGrid.width);
                
                html += `
                    <div class="breakdown">
                        <h3>Detailed Breakdown for ${firstGrid.width}×${firstGrid.height} Grid</h3>
                        <table class="breakdown-table">
                            <thead>
                                <tr>
                                    <th>Square Size</th>
                                    <th>Count</th>
                                    <th>Calculation</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                let totalSquares = 0;
                const maxSize = Math.min(firstGrid.height, firstGrid.width);
                for (let k = 1; k <= maxSize; k++) {
                    const count = (firstGrid.height - k + 1) * (firstGrid.width - k + 1);
                    totalSquares += count;
                    html += `
                        <tr>
                            <td>${k}×${k}</td>
                            <td>${count}</td>
                            <td>(${firstGrid.height}-${k}+1) × (${firstGrid.width}-${k}+1) = ${firstGrid.height - k + 1} × ${firstGrid.width - k + 1}</td>
                        </tr>
                    `;
                }

                html += `
                                <tr style="font-weight: bold; background: #ecf0f1;">
                                    <td>Total</td>
                                    <td>${totalSquares}</td>
                                    <td></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                `;
            }

            resultsContent.innerHTML = html;
        }

        calculateBtn.addEventListener('click', () => {
            const targetCount = parseInt(targetInput.value);
            if (!isNaN(targetCount) && targetCount > 0) {
                displayResults(targetCount);
            }
        });

        // Auto-calculate on page load with default value
        displayResults(parseInt(targetInput.value));

        // Allow Enter key to trigger calculation
        targetInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                calculateBtn.click();
            }
        });
    </script>
</body>
</html>
